[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/bot"
  to = "/.netlify/functions/bot"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
